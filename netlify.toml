# The website (website/public) and the friends service (website/netlify/functions).
# In Netlify: Add new site → Import from GitHub → this repo. Everything below is picked up.
[build]
  base = "website"
  publish = "public"
  command = "echo 'static site, nothing to build'"
  # Only redeploy when the website or the friends service changed (cosmetic prices included):
  # launcher-only pushes would otherwise use up Netlify's monthly build allowance for nothing.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
