<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 100 452 330" width="452" height="330">
  <defs>
    <radialGradient id="glow" cx="256" cy="262" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="200" y1="110" x2="320" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ccff"/>
    </linearGradient>
    <linearGradient id="left" x1="134" y1="190" x2="256" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b69cff"/>
      <stop offset="1" stop-color="#7043f0"/>
    </linearGradient>
    <linearGradient id="right" x1="256" y1="256" x2="378" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d3df0"/>
      <stop offset="1" stop-color="#3a168f"/>
    </linearGradient>
    <linearGradient id="ring" x1="34" y1="0" x2="478" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="front" clipPathUnits="userSpaceOnUse"><rect x="0" y="270" width="512" height="260"/></clipPath>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="452" height="330">
      <rect width="452" height="330" fill="#fff"/>
      <g transform="rotate(-16 256 270)">
        <ellipse cx="256" cy="270" rx="220" ry="64" fill="none" stroke="#000" stroke-width="40" clip-path="url(#front)"/>
      </g>
    </mask>
  </defs>

  

  <!-- the halo, back half (the cube covers its middle) -->
  <g transform="rotate(-16 256 270)">
    <ellipse cx="256" cy="270" rx="220" ry="64" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.9"/>
  </g>

  <!-- the block -->
  <g mask="url(#gap)">
    <path d="M256 112 L380 184 L256 256 L132 184 Z" fill="url(#top)"/>
    <path d="M132 184 L256 256 L256 400 L132 328 Z" fill="url(#left)"/>
    <path d="M256 256 L380 184 L380 328 L256 400 Z" fill="url(#right)"/>
    <!-- light catching the top edges -->
    <path d="M132 184 L256 256 L380 184" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
    <path d="M256 256 L256 400" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
    <!-- a pixel-cut notch on the top face, a nod to Minecraft blocks -->
    <path d="M256 150 L314 184 L256 218 L198 184 Z" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- the halo, front half -->
  <g transform="rotate(-16 256 270)">
    <ellipse cx="256" cy="270" rx="220" ry="64" fill="none" stroke="url(#ring)" stroke-width="26" clip-path="url(#front)"/>
  </g>

</svg>
